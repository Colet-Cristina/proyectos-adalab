<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <!-- ---------- ---------- -->
  <body class="body js_body">
    <header class="header">
      <h1 class="title">¿Cómo te llamas?</h1>
    </header>
    <!-- ---------- ---------- -->

    <main class="main js_main">
      <div class="container js_container">
        <label class="name-input js_nameInput" for="nameInput"
          >Dime tu nombre</label
        >
        <input
          class="input js_input"
          type="text"
          id="nameInput"
          placeholder="Nombre"
        />
        <span class="greeting js_greeting" id="greeting">Hola!</span>
        <button class="btn js_btn" id="btn">Dame click!</button>
      </div>
      <p class="instrucción">¡Haz clic en el párrafo para generar más!</p>
      <button class="btn-clear js_btnClear">Borrar párrafos</button>
      <section class="ipsum-container js_ipsumContainer">
        <p class="text js_text">
          Lorem ipsum dolor sit, amet consectetur adipisicing elit. Numquam,
          impedit quos magnam assumenda quasi expedita quam, vitae error alias
          aliquid aperiam ea. Alias, est veniam cumque excepturi veritatis non
          totam?
        </p>
        <div class="js_generatedText"></div>
      </section>
    </main>

    <!-- ---------- ---------- -->

    <footer class="footer"></footer>

    <!-- ---------- ---------- -->

    <script src="./js/main.js"></script>
  </body>
</html>
